<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Application</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container" style="border: 1px solid black;">
   <header>
    <form action="">
      <input type="text" placeholder="Enter a city....." required autofocus>
      <input type="submit" value="Search">
    </form>
   </header>
   
    <main>
        <div >
          <h1>Nairobi</h1>
          <p>
            Monday 19:00, clear sky
            <br>
            humidity: <strong>53%</strong>, Wind: <strong>3.6km/h</strong>
          </p>
        </div>
        <div class="current-temperature">🌦️12&#8451</div>
    </main>
    
    
 
    <hr>
    <footer>This project was Coded by <a href="https://github.com/carolkithinji35-ai" target="_blank">
      Carol Kithinji</a>,
      open sourced on <a href="https://github.com/carolkithinji35-ai/my-weather-application" target="_blank">
      Github</a>,
         and hosted on <a href="https://cnk-weather-app.netlify.app/" target="_blank">Netlify</a>
      
    </footer>
    <script src="index.js"></script>
  </div>  
  
</body>
</html>
